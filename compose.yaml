services:
  chrome:
    build:
      context: .
    image: chrome-vnc-userscript:local
    container_name: chrome-vnc-userscript
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SCREEN_RESOLUTION: ${SCREEN_RESOLUTION:-1366x768}
      SCRIPT_MODE: ${SCRIPT_MODE:-native}
      TZ: ${TZ:-Etc/UTC}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NOVNC_PORT:-6080}:6080"
      - "${BIND_ADDRESS:-127.0.0.1}:${VNC_PORT:-5900}:5900"
    volumes:
      - chrome-data:/home/chrome/.config/google-chrome
    shm_size: 512mb
    pids_limit: 512
    # O sandbox do Chrome precisa criar namespaces; o perfil seccomp padrão do
    # Docker Desktop bloqueia essa chamada. Mantemos o container sem privileged.
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:6080/vnc.html >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chrome-data:
